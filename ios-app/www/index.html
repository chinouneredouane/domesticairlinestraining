<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="format-detection" content="telephone=no" />
  <title>DAL TRAINING</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="backBtn" aria-label="Back" hidden>
      <span aria-hidden="true">‹</span> <span id="backLabel">Back</span>
    </button>
    <div class="topbar-title" id="topbarTitle">DAL TRAINING</div>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">
      <span aria-hidden="true" class="gear">⚙︎</span>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="pager" id="pager" hidden>
    <button class="pager-btn" id="prevBtn" aria-label="Previous module">‹ Prev</button>
    <button class="pager-btn primary" id="completeBtn">Mark complete</button>
    <button class="pager-btn" id="nextBtn" aria-label="Next module">Next ›</button>
  </nav>

  <!-- Settings sheet -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="settingsSheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <h2 id="settingsTitle">Settings</h2>

    <div class="setting">
      <div class="setting-label">Display</div>
      <div class="segmented" role="radiogroup" aria-label="Display mode">
        <button data-theme-choice="auto" role="radio">Auto</button>
        <button data-theme-choice="light" role="radio">Day</button>
        <button data-theme-choice="dark" role="radio">Night</button>
      </div>
      <p class="hint">Night mode is easier on the eyes on the flight deck and during night stops.</p>
    </div>

    <div class="setting">
      <div class="setting-label">Text size</div>
      <div class="stepper">
        <button id="textSmaller" aria-label="Smaller text">A−</button>
        <span id="textSizeLabel">100%</span>
        <button id="textLarger" aria-label="Larger text">A+</button>
      </div>
    </div>

    <div class="setting">
      <button class="danger-btn" id="resetBtn">Reset my progress</button>
    </div>

    <button class="pager-btn primary wide" id="closeSettings">Done</button>
    <p class="about">DAL TRAINING · Domestic Airlines Training Academy<br />Works fully offline.</p>
  </section>

  <!-- Image viewer -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lightboxClose" aria-label="Close image">✕</button>
    <img id="lightboxImg" alt="" />
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/course-uprt.js"></script>
  <script src="js/course-cold-weather.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
