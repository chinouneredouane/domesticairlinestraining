name: Publish DAL TRAINING web app

# Publishes ios-app/www to GitHub Pages so pilots can install DAL TRAINING
# from Safari (Share → Add to Home Screen). Runs on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web app
        working-directory: ios-app
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ios-app/www
      - id: deployment
        uses: actions/deploy-pages@v4
